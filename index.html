<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android SMS Gateway Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #1a1a1a;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0076ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #responseLog {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Configuração do SMS Gateway</h2>
    
    <form id="smsForm">
        <!-- Configurações de Ligação -->
        <div class="form-group">
            <label for="address">Endereço do Servidor (Gateway API Address)</label>
            <input type="text" id="address" placeholder="Ex: http://192.168.1.50:8080 ou https://sms-gate.app" required>
            <div class="help-text">Insira o IP/Porta local (sem a rota /message) ou o endereço do Cloud Server.</div>
        </div>

        <div class="form-group">
            <label for="username">Utilizador / Login</label>
            <input type="text" id="username" placeholder="Username gerado pela aplicação" required>
        </div>

        <div class="form-group">
            <label for="password">Palavra-passe / Token</label>
            <input type="password" id="password" placeholder="Password gerada pela aplicação" required>
        </div>

        <hr style="border: 0; border-top: 1px solid #eaeaea; margin: 20px 0;">
        <h2>Envio de Teste</h2>

        <!-- Dados do SMS -->
        <div class="form-group">
            <label for="phoneNumber">Número de Telefone</label>
            <input type="text" id="phoneNumber" placeholder="Ex: +351912345678" required>
            <div class="help-text">Inclua sempre o código do país (E.164).</div>
        </div>

        <div class="form-group">
            <label for="message">Mensagem de Texto</label>
            <textarea id="message" placeholder="Escreva a sua mensagem aqui..." required>Mensagem de teste enviada via API Android SMS Gateway.</textarea>
        </div>

        <button type="submit" id="sendBtn">Enviar SMS de Teste</button>
    </form>

    <div id="responseLog"></div>
</div>

<script>
    document.getElementById('smsForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const sendBtn = document.getElementById('sendBtn');
        const responseLog = document.getElementById('responseLog');
        
        // Obter valores dos inputs
        let address = document.getElementById('address').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const messageText = document.getElementById('message').value;

        // Normalização do Endereço de API
        // Remove barras finais se existirem para evitar duplicados
        address = address.replace(/\/\$/, "");
        
        // Define o endpoint correto caso o utilizador não tenha colocado a rota final
        let targetUrl = address;
        if (!targetUrl.endsWith('/message')) {
            targetUrl = targetUrl + '/message';
        }

        // Construção do Payload conforme especificação oficial do repositório
        const payload = {
            textMessage: {
                text: messageText
            },
            phoneNumbers: [phoneNumber]
        };

        // Interface UI - Estado de carregamento
        sendBtn.disabled = true;
        sendBtn.innerText = 'A enviar...';
        responseLog.style.display = 'none';
        responseLog.className = '';

        try {
            // Autenticação Basic Auth via cabeçalho HTTP
            const credentials = btoa(`${username}:${password}`);
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Basic ${credentials}`
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                responseLog.innerText = `Sucesso (${response.status}):\n` + JSON.stringify(data, null, 2);
                responseLog.classList.add('success');
            } else {
                responseLog.innerText = `Erro do Servidor (${response.status}):\n` + JSON.stringify(data, null, 2);
                responseLog.classList.add('error');
            }
        } catch (error) {
            responseLog.innerText = `Erro de Rede / CORS:\nNão foi possível comunicar com o gateway.\n\nDetalhes: ${error.message}\n\nNota: Se estiver a usar o Local Server, verifique se o seu browser não está a bloquear requisições HTTP (misturadas com HTTPS) ou problemas de CORS.`;
            responseLog.classList.add('error');
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = 'Enviar SMS de Teste';
            responseLog.style.display = 'block';
        }
    });
</script>

</body>
</html>
