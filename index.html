<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Agenda SMS</title><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><div class="container"><h1>Agendamentos</h1><p id="aviso" class="aviso" hidden></p><div class="grid"><div><label for="cliente">Cliente</label><select id="cliente"></select></div><div><label for="servico">Tipo de serviço</label><select id="servico"></select></div><div><label for="horario">Data e hora</label><input id="horario" type="datetime-local"></div><div><label for="duracao">Duração (minutos)</label><input id="duracao" type="number" min="1"></div></div><label for="obs">Observações</label><textarea id="obs"></textarea><div class="acoes"><button id="btnSalvar" onclick="salvar()">Salvar agendamento</button><button id="btnExcluir" class="perigo" hidden onclick="excluir(editId)">Excluir</button><button id="btnDescartar" class="sec" hidden onclick="cancelarEdicao()">Descartar edição</button></div><p id="msg" role="status"></p><div class="barra"><h2 id="semanaTitulo"></h2><div class="acoes"><button class="sec" onclick="semana(-1)">Semana anterior</button><button class="sec" onclick="semana(0)">Esta semana</button><button class="sec" onclick="semana(1)">Próxima semana</button></div></div><div class="gradewrap"><table class="semana" id="semana"></table></div><div class="barra"><h2>Lista de agendamentos</h2><label><input type="checkbox" id="passados">Incluir passados</label></div><div id="lista"></div><div id="pager" class="pager"></div></div><script src="common.js"></script><script src="app.js"></script></body></html>
