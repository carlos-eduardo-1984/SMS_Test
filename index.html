<!DOCTYPE html> <html lang="pt-PT"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android SMS Gateway</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f4f6f8;
        color: #333;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;
    }

    .container {
        width: 100%;
        max-width: 620px;
        margin: 40px auto;
        padding: 30px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 25px;
        color: #111;
    }

    .subtitle {
        margin-bottom: 25px;
        color: #666;
        font-size: 14px;
    }

    h2 {
        margin-top: 28px;
        padding-bottom: 10px;
        border-bottom: 2px solid #eee;
        font-size: 18px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
    }

    input,
    textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        font-family: inherit;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #0076ff;
        box-shadow: 0 0 0 3px rgba(0, 118, 255, .1);
    }

    textarea {
        min-height: 110px;
        resize: vertical;
    }

    .help {
        margin-top: 5px;
        color: #777;
        font-size: 12px;
    }

    .config {
        margin-bottom: 20px;
        padding: 13px;
        border: 1px solid #cfe3ff;
        border-radius: 6px;
        background: #eef6ff;
        color: #174a7c;
        font-size: 13px;
    }

    button {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 5px;
        background: #0076ff;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: #005dcc;
    }

    button:disabled {
        background: #aaa;
        cursor: not-allowed;
    }

    #status {
        display: none;
        margin-top: 20px;
        padding: 14px;
        border-radius: 6px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: monospace;
        font-size: 13px;
    }

    #status.info {
        display: block;
        color: #174a7c;
        background: #e7f3ff;
        border: 1px solid #b8dcff;
    }

    #status.success {
        display: block;
        color: #155724;
        background: #d4edda;
        border: 1px solid #c3e6cb;
    }

    #status.error {
        display: block;
        color: #721c24;
        background: #f8d7da;
        border: 1px solid #f5c6cb;
    }

    .footer {
        margin-top: 20px;
        color: #888;
        text-align: center;
        font-size: 12px;
    }

    code {
        padding: 2px 5px;
        border-radius: 3px;
        background: #eee;
    }
</style>

</head> <body> <div class="container">
<h1>📱 Android SMS Gateway</h1>

<div class="subtitle">
    Envio de SMS através de um Android ligado à rede local.
</div>

<div class="config">
    <strong>Arquitetura:</strong><br>
    GitHub Pages → API HTTPS → servidor Node.js → Android → SMS
</div>

<form id="smsForm">

    <h2>Envio de SMS</h2>

    <div class="form-group">

        <label for="phone">
            Número de telefone
        </label>

        <input
            id="phone"
            type="tel"
            placeholder="+351912345678"
            autocomplete="tel"
            maxlength="16"
            required
        >

        <div class="help">
            Utilize o formato internacional E.164.
            Exemplo: +351912345678
        </div>

    </div>

    <div class="form-group">

        <label for="message">
            Mensagem
        </label>

        <textarea
            id="message"
            maxlength="1600"
            placeholder="Digite a mensagem..."
            required
        >Mensagem de teste enviada através do Android SMS Gateway.</textarea>

        <div class="help">
            Máximo: 1600 caracteres.
        </div>

    </div>

    <button
        id="sendButton"
        type="submit"
    >
        Enviar SMS
    </button>

</form>

<div id="status"></div>

<div class="footer">
    SMS Gateway Client
</div>

</div> <script> "use strict"; /* * ============================================================ * CONFIGURAÇÃO * ============================================================ * * Este endereço deve apontar para o backend Node.js. * * EXEMPLO: * * https://sms-api.exemplo.com * * OU, durante testes com túnel: * * https://abc123.trycloudflare.com * * NÃO coloque aqui: * * http://192.168.1.100:8080 * * O navegador não deve comunicar diretamente com o Android. */ const API_URL = "https://SEU-ENDERECO-HTTPS"; const form = document.getElementById("smsForm"); const button = document.getElementById("sendButton"); const status = document.getElementById("status"); function showStatus(type, message) { status.className = type; status.textContent = message; status.style.display = "block"; } function validatePhone(phone) { /* * E.164: * * +351912345678 * +5511999999999 */ return /^\+[1-9]\d{7,14}$/.test(phone); } form.addEventListener("submit", async function(event) { event.preventDefault(); const phone = document .getElementById("phone") .value .trim(); const message = document .getElementById("message") .value .trim(); if (!API_URL || API_URL.includes("SEU-ENDERECO")) { showStatus( "error", "Configure primeiro a variável API_URL no index.html." ); return; } if (!validatePhone(phone)) { showStatus( "error", "Número inválido.\n\n" + "Use o formato E.164.\n" + "Exemplo: +351912345678" ); return; } if (!message) { showStatus( "error", "Digite uma mensagem." ); return; } button.disabled = true; button.textContent = "A enviar..."; showStatus( "info", "A enviar SMS..." ); try { const response = await fetch( API_URL.replace(/\/+$/, "") + "/api/sms", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone, message }) } ); let data; const contentType = response.headers.get("content-type") || ""; if (contentType.includes("application/json")) { data = await response.json(); } else { const text = await response.text(); data = { success: false, message: text }; } if (!response.ok) { throw new Error( data.message || `Erro HTTP ${response.status}` ); } showStatus( "success", "SMS enviado com sucesso.\n\n" + JSON.stringify(data, null, 2) ); form.reset(); } catch (error) { console.error(error); showStatus( "error", "Não foi possível enviar o SMS.\n\n" + error.message + "\n\n" + "Verifique se o backend está online e se o endereço HTTPS está correto." ); } finally { button.disabled = false; button.textContent = "Enviar SMS"; } }); </script> </body> </html>
